# V4 每日自动采集流水线
# fork 后需在 Settings → Secrets and variables → Actions 中配置：
#   DEEPSEEK_API_KEY    (必填，对应 .env 的 LLM_API_KEY)
#   FEISHU_WEBHOOK_URL  (可选，飞书推送通知)
#
# 触发方式：
#   - 每天 UTC 0:00（北京时间 08:00）自动运行
#   - 支持手动触发（workflow_dispatch）

name: Daily Collect V4

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4-production

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v4-production/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行采集流水线
        run: python -m pipeline.pipeline
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: deepseek-chat
          LLM_BASE_URL: https://api.deepseek.com/v1
          BUDGET_YUAN: 1.0
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PYTHONPATH: ${{ github.workspace }}/v4-production

      - name: 上传采集产物
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-articles
          path: v4-production/knowledge/articles/
          retention-days: 7